name: EDTEAM FastAPI demo

on:
  push:
   branches:
     - master
     - develop
Jobs:
  ci:
    runs-on: ubuntu-lastest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install dependencies
        run: |
         pip3 install -r requirements.txt

      - name: unittest
         run: |
          pytest test/test.py  
